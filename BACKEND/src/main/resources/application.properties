spring.application.name=minigoogledrive

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB


# =========================================================
# JWT
# =========================================================

# Keep your existing JWT-related configuration here if you have one.


# =========================================================
# GOOGLE LOGIN
# =========================================================

# Keep your existing Google configuration here if you have one.


# =========================================================
# EMAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kmdnazeebulzama@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# OPENROUTER
# =========================================================

openrouter.api.key=${OPENROUTER_API_KEY}